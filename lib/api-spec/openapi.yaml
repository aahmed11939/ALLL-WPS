openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: surge
    description: Hydraulic transient (water-hammer) simulation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /surge/moc:
    post:
      operationId: runMOC
      tags: [surge]
      summary: Method-of-Characteristics transient simulation
      description: >
        Runs a full MOC water-hammer simulation on a single-pipeline system.
        Supports multi-segment pipelines with piecewise-linear elevation profiles,
        configurable upstream/downstream boundary conditions, and up to 3 observation
        points. Returns an envelope (H_max / H_min per node), time-histories at each
        observation point, a pressure-rating check, and assumption notes.
        Upstream boundary (boundary_A) accepts: reservoir, pump_trip.
        Downstream boundary (boundary_B) accepts: reservoir, valve_closure,
        suction_pump_trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MOCRequest"
      responses:
        "200":
          description: Simulation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MOCResponse"
        "422":
          description: Validation error (invalid request parameters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MOCSegmentInput:
      type: object
      description: One pipe segment in the multi-segment pipeline.
      properties:
        L_m:
          type: number
          description: Segment length [m]
        D_m:
          type: number
          description: Internal diameter [m]
        roughness_m:
          type: number
          description: Absolute pipe roughness [m]
        elev_start_m:
          type: number
          default: 0.0
          description: Elevation at segment start [m]
        elev_end_m:
          type: number
          default: 0.0
          description: Elevation at segment end [m]
      required: [L_m, D_m, roughness_m]

    MOCBCReservoir:
      type: object
      description: Constant-head reservoir / fixed-HGL boundary.
      properties:
        type:
          type: string
          enum: [reservoir]
        H_m:
          type: number
          description: Reservoir total piezometric head [m]
      required: [type, H_m]

    MOCBCPumpTrip:
      type: object
      description: >
        Upstream pump boundary with quadratic head-decay trip model.
        H_source(t) = H_pump × (1 − t/t_trip)². Q clamped ≥ 0 (check valve).
      properties:
        type:
          type: string
          enum: [pump_trip]
        H_pump_m:
          type: number
          description: Steady-state pump total head [m]
        Q_m3s:
          type: number
          description: Steady-state flow rate [m³/s]
        t_trip_s:
          type: number
          description: Trip duration [s]
        H_reservoir_m:
          type: number
          default: 0.0
          description: Suction reservoir HGL post-trip [m]
      required: [type, H_pump_m, Q_m3s, t_trip_s]

    MOCBCValveClosure:
      type: object
      description: Downstream valve closure — gate-valve model Q = Q₀·τ(t)².
      properties:
        type:
          type: string
          enum: [valve_closure]
        Q_m3s:
          type: number
          description: Steady-state flow rate [m³/s]
        t_close_s:
          type: number
          description: Closure time [s]
        profile:
          type: string
          enum: [linear, equal_percentage]
          default: linear
      required: [type, Q_m3s, t_close_s]

    MOCBCSuctionPumpTrip:
      type: object
      description: Downstream suction boundary — pump demand decays to zero over t_trip.
      properties:
        type:
          type: string
          enum: [suction_pump_trip]
        H_sump_m:
          type: number
          description: Sump total piezometric head [m]
        Q_m3s:
          type: number
          description: Steady-state flow rate [m³/s]
        t_trip_s:
          type: number
          description: Trip duration [s]
      required: [type, H_sump_m, Q_m3s, t_trip_s]

    MOCBoundaryAInput:
      description: >
        Upstream boundary condition (node 0).
        Valid types: reservoir, pump_trip.
      oneOf:
        - $ref: "#/components/schemas/MOCBCReservoir"
        - $ref: "#/components/schemas/MOCBCPumpTrip"
      discriminator:
        propertyName: type

    MOCBoundaryBInput:
      description: >
        Downstream boundary condition (node N).
        Valid types: reservoir, valve_closure, suction_pump_trip.
      oneOf:
        - $ref: "#/components/schemas/MOCBCReservoir"
        - $ref: "#/components/schemas/MOCBCValveClosure"
        - $ref: "#/components/schemas/MOCBCSuctionPumpTrip"
      discriminator:
        propertyName: type

    MOCObservationPoint:
      type: object
      properties:
        label:
          type: string
          default: ""
        frac:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Fractional distance along pipeline [0–1]
      required: [frac]

    MOCRequest:
      type: object
      description: Request body for POST /surge/moc
      properties:
        pipeline:
          type: string
          enum: [suction, discharge]
          default: discharge
        wave_speed_ms:
          type: number
          description: Acoustic wave speed a [m/s]
        Q_0_m3s:
          type: number
          description: Steady-state flow rate [m³/s]
        H_0_m:
          type: number
          default: 0.0
          description: Steady-state upstream piezometric head [m]
        temperature_C:
          type: number
          default: 20.0
          minimum: -10.0
          maximum: 100.0
        rho_kg_m3:
          type: number
          default: 1000.0
        pressure_rating_kPa:
          type: number
          nullable: true
          description: Pipe pressure rating for pass/fail check [kPa]
        segments:
          type: array
          items:
            $ref: "#/components/schemas/MOCSegmentInput"
          minItems: 1
        boundary_A:
          $ref: "#/components/schemas/MOCBoundaryAInput"
        boundary_B:
          $ref: "#/components/schemas/MOCBoundaryBInput"
        observation_points:
          type: array
          items:
            $ref: "#/components/schemas/MOCObservationPoint"
          maxItems: 3
        n_reaches:
          type: integer
          minimum: 10
          maximum: 200
          nullable: true
          description: Number of computational reaches (default: auto from Courant = 1)
        t_total_s:
          type: number
          nullable: true
          description: Total simulation duration [s] (default: max(10 × T_char, 30 s))
        unit_system:
          type: string
          enum: [SI, US]
          default: SI
      required: [wave_speed_ms, Q_0_m3s, segments, boundary_A, boundary_B]

    MOCEnvelopePoint:
      type: object
      description: Per-node pressure envelope across full simulation duration.
      properties:
        x_m:
          type: number
          description: Distance from upstream end [m]
        elev_m:
          type: number
          description: Pipe centreline elevation [m]
        H_max_m:
          type: number
          description: Maximum piezometric head over all time steps [m]
        H_min_m:
          type: number
          description: Minimum piezometric head over all time steps [m]
        P_max_kPa:
          type: number
          description: Maximum gauge pressure [kPa]
        P_min_kPa:
          type: number
          description: Minimum gauge pressure [kPa]
      required: [x_m, elev_m, H_max_m, H_min_m, P_max_kPa, P_min_kPa]

    MOCTimePoint:
      type: object
      properties:
        t_s: { type: number, description: "Simulation time [s]" }
        H_m: { type: number, description: "Piezometric head at observation node [m]" }
        P_kPa: { type: number, description: "Gauge pressure [kPa]" }
      required: [t_s, H_m, P_kPa]

    MOCObservationResult:
      type: object
      description: Time-history at one observation point.
      properties:
        label: { type: string }
        frac: { type: number }
        node_index: { type: integer }
        time_history:
          type: array
          items:
            $ref: "#/components/schemas/MOCTimePoint"
      required: [label, frac, node_index, time_history]

    MOCPressureRatingCheck:
      type: object
      properties:
        rating_kPa: { type: number }
        max_P_kPa: { type: number }
        passes: { type: boolean }
        margin_pct: { type: number }
      required: [rating_kPa, max_P_kPa, passes, margin_pct]

    MOCResponse:
      type: object
      description: >
        Full MOC simulation result. All head values are total piezometric head [m];
        pressure values are gauge pressure [kPa].
      properties:
        pipeline:
          type: string
          description: Echo of requested pipeline side (suction|discharge)
        N:
          type: integer
          description: Number of computational reaches
        dx_m:
          type: number
          description: Spatial step size [m]
        dt_s:
          type: number
          description: Time step [s] (= dx_m / wave_speed_ms, Courant = 1)
        courant:
          type: number
          description: Courant number (always 1.0)
        t_total_s:
          type: number
          description: Total simulation duration [s]
        n_steps:
          type: integer
          description: Number of time steps
        D_m:
          type: number
          description: Effective (flow-weighted mean) pipe diameter [m]
        f:
          type: number
          description: Darcy-Weisbach friction factor (Swamee-Jain)
        T_char_s:
          type: number
          description: Characteristic wave travel time 2L/a [s]
        envelope:
          type: array
          items:
            $ref: "#/components/schemas/MOCEnvelopePoint"
          description: Pressure envelope (H_max, H_min) at each node
        observations:
          type: array
          items:
            $ref: "#/components/schemas/MOCObservationResult"
          description: Time-history at each requested observation point
        global_max_H_m:
          type: number
          description: System-wide maximum piezometric head [m]
        global_min_H_m:
          type: number
          description: System-wide minimum piezometric head [m]
        global_max_P_kPa:
          type: number
          description: System-wide maximum gauge pressure [kPa]
        global_min_P_kPa:
          type: number
          description: System-wide minimum gauge pressure [kPa]
        cavitation_x_m:
          type: array
          items:
            type: number
          description: >
            x-coordinates [m] of nodes where column separation was detected
            (head fell to vapour pressure). Empty array if no cavitation.
        h_vap_m:
          type: number
          description: Vapour pressure head at simulation temperature [m gauge]
        temperature_C:
          type: number
          description: Water temperature used for vapour pressure calculation [°C]
        assumption_notes:
          type: array
          items:
            type: string
          description: Engineering assumption notes for report / audit trail
        rating_check:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MOCPressureRatingCheck"
          description: Pressure rating pass/fail check (null if not requested)
        unit_system:
          type: string
          enum: [SI, US]
      required:
        - pipeline
        - N
        - dx_m
        - dt_s
        - courant
        - t_total_s
        - n_steps
        - D_m
        - f
        - T_char_s
        - envelope
        - observations
        - global_max_H_m
        - global_min_H_m
        - global_max_P_kPa
        - global_min_P_kPa
        - cavitation_x_m
        - h_vap_m
        - temperature_C
        - assumption_notes
        - unit_system

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg: { type: string }
              type: { type: string }
