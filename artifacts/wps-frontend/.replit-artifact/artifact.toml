kind = "web"
previewPath = "/"
title = "ALLL WPS Designer"
version = "1.0.0"
id = "artifacts/wps-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20825

[services.development]
run = "cd /home/runner/workspace/frontend && npm run dev"

[services.production]
build = ["bash", "-c", "cd /home/runner/workspace/frontend && npm install --legacy-peer-deps && npm run build"]
publicDir = "frontend/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20825"
BASE_PATH = "/"
