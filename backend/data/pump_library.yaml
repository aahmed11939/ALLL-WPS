# Pump library for ALLL WPS Designer.
#
# Each pump includes:
#   curve_coefficients  — legacy polynomial H = A + B*Q + C*Q² (Q in m³/h, H in m)
#   hq_curve            — tabular H-Q data (Q m³/h → H m)
#   eta_q_curve         — tabular efficiency data (Q m³/h → η %)
#   p_q_curve           — tabular shaft-power data (Q m³/h → P kW)
#   npshr_q_curve       — tabular NPSHr data (Q m³/h → NPSHr m)
#   type_key            — matches pump_type catalogue key for filtering
#   potable_duty        — True if listed for municipal drinking-water service
#
# All values are illustrative. Verify against manufacturer certified test curves
# before using in detailed design.

