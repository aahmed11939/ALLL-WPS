kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/compute", "/surge", "/export"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = ["bash", "scripts/build-production.sh"]
run = ["bash", "scripts/start-production.sh"]

[services.production.health.startup]
path = "/api/healthz"
